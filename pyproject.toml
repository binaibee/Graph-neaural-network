[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-gnn"
version = "1.0.0"
description = "Scam detection with graph neural networks across SMS, email and web-link communications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "torch-geometric>=2.6",
  "streamlit>=1.50",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
minilm = ["sentence-transformers>=3.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
